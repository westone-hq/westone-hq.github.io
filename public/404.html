<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Westone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Noto+Sans+KR:wght@300;400&family=Playfair+Display:ital,wght@0,300;1,300&display=swap" rel="stylesheet">
    <script>
        (function() {
            var l = window.location;
            var path = l.pathname;
            if (path === '/' || path === '/menu' || path.startsWith('/project/')) {
                l.replace(
                    l.protocol + '//' + l.host +
                    l.pathname.split('/').slice(0, 1).join('/') +
                    '/?/' +
                    l.pathname.slice(1).split('/').slice(0).join('/').replace(/&/g, '~and~') +
                    (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
                    l.hash
                );
            }
        })();
    </script>
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #a855f7;
            --gray-50: rgba(255, 255, 255, 0.5);
            --gray-30: rgba(255, 255, 255, 0.3);
            --white-70: rgba(255, 255, 255, 0.7);
            --f-display: 'Playfair Display', serif;
            --f-sans: 'Inter', 'Noto Sans KR', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--f-sans);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.04;
            z-index: 100;
            width: 100%;
            height: 100%;
        }

        .noise-overlay svg {
            width: 100%;
            height: 100%;
        }

        .container {
            position: relative;
            z-index: 10;
            padding: 2rem;
            max-width: 90vw;
        }

        .error-label {
            font-family: ui-monospace, 'Courier New', monospace;
            font-size: 12px;
            color: var(--accent);
            letter-spacing: 0.6em;
            text-transform: uppercase;
            margin-bottom: 2rem;
            display: block;
        }

        .giant-404 {
            font-family: var(--f-display);
            font-weight: 300;
            font-style: italic;
            font-size: 25vw;
            line-height: 0.9;
            margin-bottom: 2rem;
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--white-70);
            margin-bottom: 0.75rem;
            animation: fadeIn 0.8s ease-out 0.4s forwards;
            opacity: 0;
            letter-spacing: -0.01em;
        }

        .description {
            font-size: 0.95rem;
            font-weight: 300;
            color: var(--gray-50);
            margin-bottom: 4rem;
            animation: fadeIn 0.8s ease-out 0.5s forwards;
            opacity: 0;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeIn 0.8s ease-out 0.8s forwards;
            opacity: 0;
        }

        .cta-button {
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
            padding: 1rem 2rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: var(--text);
            text-decoration: none;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .cta-button svg {
            width: 1.2em;
            height: 1.2em;
            fill: currentColor;
        }

        .cta-button:hover {
            background-color: var(--text);
            color: var(--bg);
            border-color: var(--text);
            transform: translateY(-2px);
        }

        .footer {
            position: fixed;
            bottom: 2.5rem;
            right: 2.5rem;
            font-size: 10px;
            color: var(--gray-30);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(40px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .giant-404 { font-size: 45vw; }
            .subtitle   { font-size: 1.25rem; }
            .description { font-size: 0.85rem; padding: 0 1rem; }
            .footer { right: 0; left: 0; bottom: 2rem; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="noise-overlay">
        <svg viewBox="0 0 200 200" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
            <filter id="noiseFilter">
                <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
            </filter>
            <rect width="100%" height="100%" filter="url(#noiseFilter)"/>
        </svg>
    </div>

    <main class="container">
        <span class="error-label">ERROR</span>
        <h1 class="giant-404">404</h1>
        <p class="subtitle">페이지를 찾을 수 없습니다</p>
        <p class="description">요청하신 주소가 존재하지 않거나 이동되었습니다.</p>
        <div class="button-group">
            <a href="https://kmong.com/gig/747278" target="_blank" rel="noopener noreferrer" class="cta-button">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                의뢰 사이트
            </a>
            <a href="https://x.com" target="_blank" rel="noopener noreferrer" class="cta-button">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M18.901 1.153h3.68l-8.04 9.19L24 22.846h-7.406l-5.8-7.584-6.638 7.584H.474l8.6-9.83L0 1.154h7.594l5.243 6.932L18.901 1.153ZM17.61 20.644h2.039L6.486 3.24H4.298L17.61 20.644Z"/></svg>
                SNS
            </a>
            <a href="https://github.com/westone-hq" target="_blank" rel="noopener noreferrer" class="cta-button">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.372.79 1.102.79 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                GitHub
            </a>
        </div>
    </main>

    <footer class="footer">Westone &copy; 2025</footer>

</body>
</html>
